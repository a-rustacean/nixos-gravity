name: Gravity stage-two boot bundle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gravity-boot.yml
      - installer/boot-sources.json
      - installer/build-gravity-stage2.sh
      - installer/assemble_esp.py
      - installer/make_installer_package.py
      - installer/test_assemble_esp.py
      - installer/patch_gravity_urlcache.py
      - installer/test_patch_gravity_urlcache.py
      - installer/patch_gravity_volbootable.py
      - installer/fsctl_bootable_helper.py
      - installer/test_patch_gravity_volbootable.py
      - installer/patch_gravity_preboot_chflags.py
      - installer/preboot_chflags_helper.py
      - installer/test_patch_gravity_preboot_chflags.py
      - installer/runtime-source.json
      - installer/make_release_kit.py
      - installer/test_make_release_kit.py
      - installer/devices.json
      - installer/devices.py
      - installer/installer_data.json
      - installer/check_data.py
      - install.sh
      - flake.nix
      - flake.lock
      - configuration.nix
      - modules/**
      - pkgs/linux/**
  pull_request:
    paths:
      - .github/workflows/gravity-boot.yml
      - installer/boot-sources.json
      - installer/build-gravity-stage2.sh
      - installer/assemble_esp.py
      - installer/make_installer_package.py
      - installer/test_assemble_esp.py
      - installer/patch_gravity_urlcache.py
      - installer/test_patch_gravity_urlcache.py
      - installer/patch_gravity_volbootable.py
      - installer/fsctl_bootable_helper.py
      - installer/test_patch_gravity_volbootable.py
      - installer/patch_gravity_preboot_chflags.py
      - installer/preboot_chflags_helper.py
      - installer/test_patch_gravity_preboot_chflags.py
      - installer/runtime-source.json
      - installer/make_release_kit.py
      - installer/test_make_release_kit.py
      - installer/devices.json
      - installer/devices.py
      - installer/installer_data.json
      - installer/check_data.py
      - install.sh
      - flake.nix
      - flake.lock
      - configuration.nix
      - modules/**
      - pkgs/linux/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KIT_ID: mac-mini-m4

jobs:
  build-stage-two:
    name: Build pinned Gravity m1n1 + U-Boot payload
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GRAVITY_INSTALLER_REF: 6420623289fe7544cb8589b658355e57f0290fcc
      GRAVITY_BOOTLOADER_REF: f5f5d4520587b6b8e2d8eb4d866baae129f47765
      GRAVITY_LINUX_REF: 4fc326f6c25ccceb7515e2635c22e01fde5d3bac
      GRAVITY_UBOOT_REF: a44f46af0aa17e48572e0d46c0d082886ee353c3
      RUSTUP_TOOLCHAIN: 1.93.1
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check pinned source metadata
        run: python3 installer/check_boot_sources.py

      - name: Check out Gravity installer and its pinned submodules
        uses: actions/checkout@v4
        with:
          repository: GravityLinux/installer
          ref: ${{ env.GRAVITY_INSTALLER_REF }}
          path: gravity-installer
          submodules: recursive

      - name: Check out Gravity Linux device trees
        uses: actions/checkout@v4
        with:
          repository: GravityLinux/linux
          ref: ${{ env.GRAVITY_LINUX_REF }}
          path: linux
          sparse-checkout: arch/arm64/boot/dts/apple/

      - name: Check out Gravity U-Boot
        uses: actions/checkout@v4
        with:
          repository: GravityLinux/u-boot
          ref: ${{ env.GRAVITY_UBOOT_REF }}
          path: u-boot

      - name: Check out the pinned Gravity bootloader revision
        run: |
          git -C gravity-installer/bootloader fetch --depth=1 origin "$GRAVITY_BOOTLOADER_REF"
          git -C gravity-installer/bootloader checkout --detach "$GRAVITY_BOOTLOADER_REF"
          actual=$(git -C gravity-installer/bootloader rev-parse HEAD)
          test "$actual" = "$GRAVITY_BOOTLOADER_REF"

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison device-tree-compiler flex gcc-aarch64-linux-gnu \
            imagemagick libgnutls28-dev libssl-dev python3-dev swig zip
          if ! command -v magick >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            ln -s "$(command -v convert)" "$HOME/.local/bin/magick"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add aarch64-unknown-none-softfloat --toolchain "$RUSTUP_TOOLCHAIN"

      - name: Build stage-two payload
        run: bash installer/build-gravity-stage2.sh

      - name: Test ESP assembly contract
        working-directory: installer
        run: >-
          python3 -m unittest -v
          test_assemble_esp.py
          test_patch_gravity_urlcache.py
          test_patch_gravity_volbootable.py
          test_patch_gravity_preboot_chflags.py
          test_make_release_kit.py

      - name: Upload stage-two build artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: gravity-${{ env.KIT_ID }}-stage2
          path: out/
          if-no-files-found: error
          retention-days: 30

  package-installer-input:
    name: Assemble Gravity installer ZIP input
    needs: build-stage-two
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Download verified Gravity stage-two artifact
        uses: actions/download-artifact@v4
        with:
          name: gravity-${{ env.KIT_ID }}-stage2
          path: ${{ runner.temp }}/gravity-stage2

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2

      - name: Build NixOS ESP and root image
        run: |
          nix build --print-build-logs \
            --out-link "$RUNNER_TEMP/nixos-esp" \
            .#packages.aarch64-linux.nixos-esp
          nix build --print-build-logs \
            --out-link "$RUNNER_TEMP/root-image" \
            .#packages.aarch64-linux.root-image

      - name: Assemble and verify Gravity installer ZIP input
        run: |
          python3 installer/make_installer_package.py \
            "$RUNNER_TEMP/nixos-esp" \
            "$RUNNER_TEMP/gravity-stage2/gravity-${KIT_ID}-stage2.zip" \
            "$RUNNER_TEMP/root-image" \
            "$RUNNER_TEMP/nixos-gravity-${KIT_ID}.zip"

      - name: Assemble versioned installer assets (test artifact only)
        run: |
          runtime_url=$(python3 -c 'import json; print(json.load(open("installer/runtime-source.json"))["url"])')
          runtime_sha=$(python3 -c 'import json; print(json.load(open("installer/runtime-source.json"))["sha256"])')
          runtime_archive="$RUNNER_TEMP/gravity-installer-runtime.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "$runtime_url" --output "$runtime_archive"
          printf '%s  %s\n' "$runtime_sha" "$runtime_archive" | sha256sum --check --status
          python3 installer/make_release_kit.py \
            "$runtime_archive" \
            "$RUNNER_TEMP/nixos-gravity-${KIT_ID}.zip" \
            "$KIT_ID" \
            "ci-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/release-assets"

      - name: Upload assembled installer input (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: nixos-gravity-${{ env.KIT_ID }}-installer-input
          path: ${{ runner.temp }}/nixos-gravity-${{ env.KIT_ID }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload versioned installer assets (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: nixos-gravity-${{ env.KIT_ID }}-test-kit
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 30
